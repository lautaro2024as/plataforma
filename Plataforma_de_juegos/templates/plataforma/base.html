{% load static %}
<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NEXUS - Gaming Marketplace{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            cyan: '#06b6d4',
                            purple: '#8b5cf6',
                            gold: '#eab308',
                            dark: '#0b0f19',
                            card: '#111827',
                            border: '#1f2937'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/nexus.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body
    class="min-h-screen flex flex-col bg-slate-950 text-slate-100 font-sans selection:bg-cyan-400 selection:text-black overflow-x-hidden"
    data-active-view="{{ active_view|default:'store' }}"
>
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="ambient-blob ambient-cyan"></div>
        <div class="ambient-blob ambient-purple"></div>
        <div class="ambient-blob ambient-gold"></div>
    </div>

    {% block content %}{% endblock %}

    <script src="{% static 'js/nexus.js' %}" defer></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
