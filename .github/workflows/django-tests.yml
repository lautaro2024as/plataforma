name: Django tests

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_USE_SQLITE: "1"
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "Django>=5.2,<5.3" psutil Pillow lz4
      - name: Django checks
        working-directory: Plataforma_de_juegos
        run: python manage.py check
      - name: Automated tests
        working-directory: Plataforma_de_juegos
        run: python manage.py test
